apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: a3t-api
  labels:
    cloud.googleapis.com/location: us-central1
spec:
  template:
    spec:
      containers:
        - image: gcr.io/YOUR_PROJECT_ID/a3t-api:latest
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: a3t-db-url
                  key: latest
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: anthropic-api-key
                  key: latest
            - name: ENVIRONMENT
              value: production
          ports:
            - containerPort: 8000
          resources:
            limits:
              memory: 512Mi
              cpu: "1.0"
