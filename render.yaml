# Render Blueprint Configuration for Always A (Trivial) Triple Threat (A3T)
# For setup documentation, see docs/DEPLOYMENT.md

services:
  # ---------------------------------------------------------------------------
  # 1. A3T Python API & MCP Server (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: a3t-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ANTHROPIC_API_KEY
        sync: false
      # Supabase session pooler URL, set in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ---------------------------------------------------------------------------
  # 2. A3T Frontend Web App (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: a3t-web
    env: static
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_PATH
        value: /
      # Sentry error reporting for the browser; read at build time.
      - key: VITE_SENTRY_DSN
        sync: false

# The database is hosted on Supabase, not Render: free Render databases
# expire after 30 days.
