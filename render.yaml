# Render Blueprint Configuration for Always A (Trivial) Triple Threat (A3T)
# For setup documentation, see docs/RENDER_DEPLOYMENT.md

services:
  # ---------------------------------------------------------------------------
  # 1. A3T Python API & MCP Server (Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: a3t-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.mcp_server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---------------------------------------------------------------------------
  # 2. A3T Frontend Web App (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: a3t-web
    env: static
    buildCommand: pnpm install && pnpm build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BASE_PATH
        value: /
