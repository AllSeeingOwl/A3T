name: Deploy Questions to Live Game

on:
  push:
    branches: [main]
    paths:
      - 'data/questions.csv'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Export CSV to JSON
        run: |
          python scripts/export_to_json.py --input data/questions.csv --output src/data/questions.json

      - name: Commit JSON export
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Github Action"
          git add src/data/questions.json
          git commit -m "chore: update questions.json from CSV"
          git push

      - name: Trigger GitHub Pages build
        run: |
          echo "✅ GitHub Pages will auto-build from main branch"
          echo "Questions updated and live!"
