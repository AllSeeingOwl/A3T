name: Sync Google Sheets Questions

on:
  schedule:
    # Run automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

permissions:
  contents: write # Needed to commit the updated CSV back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Run Sync Script
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_CREDENTIALS }}
        run: pnpm run update-questions

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are any changes to data/questions.csv
          if [[ -n $(git status -s data/questions.csv) ]]; then
            echo "Changes detected in questions.csv, committing..."
            git add data/questions.csv
            git commit -m "chore(data): auto-sync questions from Google Sheets"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi
