name: Validate Questions

on:
  pull_request:
    paths:
      - 'data/questions.csv'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history to compare

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install fuzzywuzzy python-levenshtein PyYAML

      - name: Get changed questions
        id: changed-files
        run: |
          git fetch origin main:main
          git diff main HEAD -- data/questions.csv > /tmp/questions_diff.patch
          python scripts/validate_questions_pr.py --diff /tmp/questions_diff.patch --output /tmp/validation_report.json

      - name: Generate PR comment
        id: pr-comment
        run: |
          python scripts/generate_pr_comment.py --report /tmp/validation_report.json --output /tmp/pr_comment.md

      - name: Post validation report to PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('/tmp/pr_comment.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check validation status
        run: |
          python -c "
          import json
          with open('/tmp/validation_report.json') as f:
              report = json.load(f)

          critical_failures = report.get('critical_failures', 0)
          if critical_failures > 0:
              print(f'CRITICAL: {critical_failures} critical violations found')
              exit(1)
          else:
              print('✓ All validations passed')
              exit(0)
          "
